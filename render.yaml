# Free PostgreSQL expires after 30 days. Upgrade or migrate before expiry.
services:
  - type: web
    name: leap-ai-production
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: AI_INTERVIEW_ENABLED
        value: "false"
      - key: FRONTEND_URL
        value: https://leap-ai-khaki.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: leap-ai-production-db
          property: connectionString
databases:
  - name: leap-ai-production-db
    plan: free
    region: oregon
    ipAllowList: []
