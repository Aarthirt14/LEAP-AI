name: Backend release checks
on:
  pull_request:
  push:
    branches: [main, improve/voice-recovery-data-quality]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: leap_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: leap_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leap_test -d leap_release_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://leap_test:disposable_ci_only@localhost:5432/leap_release_test
      JWT_SECRET: disposable-ci-jwt-secret-not-for-deployment
      SECRET_KEY: disposable-ci-secret-not-for-deployment
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Unit and API tests (SQLite)
        run: python -m pytest -q
      - name: Check bundled catalogue
        run: cmp ../data/nqr-reference.json seed/data/nqr-reference.json
      - name: PostgreSQL migrations
        run: python -m alembic upgrade head
      - name: PostgreSQL concurrency and import
        run: python -m integration.postgres_release
      - name: PostgreSQL rollback and re-upgrade
        run: |
          python -m alembic downgrade 342db47bc5d6
          python -m alembic upgrade head
